server.port=20018
spring.application.name=ioi-service

server.hostname=localhost
spring.profiles.active=dev
management.endpoints.web.exposure.include=health,mappings
management.endpoint.mappings.enabled=true
management.endpoint.health.show-details=always

# Application Information
spring.application.description=IOI Service for generating IOIs for clients and sending them to FIX Gateway

# Validation Configuration
spring.validation.enabled=true

# Performance Configuration
spring.main.lazy-initialization=false
spring.main.banner-mode=console

# MongoDB Configuration
logging.level.org.mongodb.driver.cluster=off
spring.data.mongodb.uri=mongodb://workbench_user:workbench_user@leonadeoyemongodbcluster-shard-00-01-gni1u.azure.mongodb.net:27017,leonadeoyemongodbcluster-shard-00-00-gni1u.azure.mongodb.net:27017,leonadeoyemongodbcluster-shard-00-02-gni1u.azure.mongodb.net:27017/admin?serverSelectionTimeoutMS=20000&readPreference=primary&ssl=true
spring.data.mongodb.database=workbench
spring.data.mongodb.port=27017

# Pricing service (Parametrics ADV and close/open prices)
ioi.pricing-service-url=http://localhost:20015

# Market service (last price subscribe / unsubscribe)
ioi.market-service-url=http://localhost:20019

# Exchange service (persisted FX rates)
ioi.exchange-service-url=http://localhost:20014

# Domain service (exchange session hours)
ioi.domain-service-url=http://localhost:20009

# Configuration service (SYSTEM owner rule thresholds)
ioi.configuration-service-url=http://localhost:20001

# IOI rule thresholds (fallbacks if configuration-service is unavailable)
ioi.rules.min-notional-usd=100000
ioi.rules.min-adv-percentage=5.0
ioi.rules.min-quantity=50000
ioi.rules.max-price-deviation-percent=2.0

# IOI lifetime and regeneration (fallbacks if configuration-service is unavailable)
ioi.default-lifetime-minutes=15
ioi.regeneration-interval-seconds=60

# AMPS
amps.server.url=tcp://localhost:9007/amps/json?ip_protocol_prefer=ipv6
amps.inbound.topic.name=ioi.inbound
amps.outbound.topic.name=ioi.outbound
amps.inbound.client.name=IoiSubscriber
amps.outbound.client.name=IoiPublisher
amps.market-data.topic.name=market.data
amps.market-data.client.name=IoiLastPriceSubscriber
amps.enabled=true

# Disruptor
disruptor.buffer.size=4096
shutdown.sleep.duration=5000
